<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carnet d'Exploits</title>

<!-- PWA -->
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#08080c">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Exploits">

<style>
:root{
  --bg: #08080c;
  --bg-elevated: #0f0f17;
  --surface: #15151d;
  --surface-2: #1b1b26;
  --border: rgba(255,255,255,0.08);
  --border-strong: rgba(255,255,255,0.16);
  --cyan: #4fd8ff;
  --pink: #ff5fb4;
  --text: #f4f5f9;
  --text-dim: rgba(244,245,249,0.62);
  --text-faint: rgba(244,245,249,0.36);
  --danger: #ff6b74;
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  --font-mono: 'SF Mono', 'Menlo', 'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
body{
  background: var(--bg);
  background-image:
    radial-gradient(circle at 12% -5%, rgba(79,216,255,0.10), transparent 42%),
    radial-gradient(circle at 90% 105%, rgba(255,95,180,0.08), transparent 42%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  padding: 0 0 60px 0;
}

/* ===== AUTH SCREEN ===== */
.auth-screen{ min-height: 100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding: 24px; }
.auth-box{ width:100%; max-width: 360px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 20px; padding: 32px 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.auth-title{ font-family: var(--font-display); font-weight: 700; font-size: 27px; letter-spacing: -0.02em; margin-bottom: 6px; text-align:center; color: var(--text); }
.auth-title span{ background: linear-gradient(135deg, var(--cyan), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.auth-sub{ font-family: var(--font-mono); font-size: 11px; text-align:center; color: var(--text-dim); margin-bottom: 24px; letter-spacing: 2px; text-transform: uppercase; }
.auth-box input{ width:100%; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding:13px 15px; font-family: var(--font-body); font-size:15px; color: var(--text); margin-bottom: 12px; outline:none; transition: border-color .15s ease; }
.auth-box input:focus{ border-color: var(--cyan); }
.auth-box input::placeholder{ color: var(--text-faint); }
.auth-box button{ width:100%; background: linear-gradient(135deg, var(--cyan), var(--pink)); color: #05050a; border:none; font-family: var(--font-body); font-weight:600; font-size:15px; padding:14px; border-radius:12px; cursor:pointer; margin-top: 4px; box-shadow: 0 0 24px rgba(79,216,255,0.25); transition: filter .15s ease; }
.auth-box button:hover{ filter: brightness(1.08); }
.auth-switch{ text-align:center; margin-top:16px; font-size:13px; color: var(--text-dim); }
.auth-switch a{ color: var(--cyan); cursor:pointer; text-decoration: none; font-weight:600; }
.auth-error{ color: var(--danger); font-size: 13px; margin-bottom: 10px; min-height: 14px; font-family: var(--font-body); text-align:center; }

/* ===== APP ===== */
#app{ display:none; }
.header{ background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg) 100%); border-bottom: 1px solid var(--border); padding: 30px 20px 24px; position: relative; }
.header::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:1px; background: linear-gradient(90deg, transparent, var(--cyan), var(--pink), transparent); opacity:0.55; }
.top-row{ display:flex; justify-content:space-between; align-items:flex-start; }
.eyebrow{ font-family: var(--font-mono); letter-spacing: 2.5px; font-size: 11px; color: var(--text-faint); text-transform: uppercase; margin-bottom: 6px; }
.title{ font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -0.02em; color: var(--text); }
.title span{ background: linear-gradient(135deg, var(--cyan), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logout-btn{ background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); font-family: var(--font-body); font-size: 12px; font-weight:500; padding: 8px 14px; border-radius: 20px; cursor:pointer; flex-shrink:0; transition: border-color .15s ease; }
.logout-btn:hover{ border-color: var(--border-strong); color: var(--text); }

.rank-bar{ margin-top: 20px; display:flex; align-items:center; gap: 14px; }
.rank-badge{ width: 56px; height: 56px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-family: var(--font-display); font-size: 20px; font-weight:700; color: var(--text); background: var(--surface); border: 2px solid var(--cyan); box-shadow: 0 0 18px rgba(79,216,255,0.45), inset 0 0 14px rgba(79,216,255,0.12); flex-shrink:0; }
.rank-info{ flex:1; }
.rank-name{ font-family: var(--font-body); font-size: 14px; font-weight:600; letter-spacing: -0.01em; color: var(--text); }
.xp-track{ margin-top: 7px; height: 6px; background: var(--surface); border-radius: 3px; overflow:hidden; border: 1px solid var(--border); }
.xp-fill{ height:100%; background: linear-gradient(90deg, var(--cyan), var(--pink)); width: 0%; transition: width 0.6s ease; box-shadow: 0 0 10px rgba(79,216,255,0.6); }
.xp-label{ font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); margin-top: 5px; }

.streak-row{ margin-top: 18px; display:flex; gap: 10px; align-items:center; }
.checkin-btn{ background: linear-gradient(135deg, var(--cyan), var(--pink)); color: #05050a; border: none; font-family: var(--font-body); font-weight: 600; font-size: 13px; padding: 10px 18px; border-radius: 10px; cursor: pointer; box-shadow: 0 0 16px rgba(79,216,255,0.25); transition: filter 0.15s ease, transform 0.15s ease; }
.checkin-btn:hover{ filter: brightness(1.08); }
.checkin-btn:active{ transform: scale(0.96); }
.checkin-btn:disabled{ background: var(--surface); color: var(--text-faint); box-shadow:none; cursor:default; }
.streak-count{ font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }

.action-bar{ padding: 18px 20px 0; display:flex; gap:10px; }
.new-achievement-btn{ flex:2; background: var(--surface-2); color: var(--text); border: 1px solid var(--border-strong); font-family: var(--font-body); font-weight:600; font-size: 14px; padding: 13px; border-radius: 12px; cursor:pointer; transition: border-color .15s ease, box-shadow .15s ease; }
.new-achievement-btn:hover{ border-color: var(--cyan); box-shadow: 0 0 16px rgba(79,216,255,0.15); }
.manage-cat-btn{ flex:1; background: var(--surface); color: var(--text-dim); border: 1px solid var(--border); font-family: var(--font-body); font-weight:500; font-size: 13px; padding: 13px 8px; border-radius: 12px; cursor:pointer; transition: border-color .15s ease, color .15s ease; }
.manage-cat-btn:hover{ border-color: var(--pink); color: var(--text); }

.categories{ display:flex; gap: 8px; overflow-x: auto; padding: 16px 20px 4px; scrollbar-width: none; }
.categories::-webkit-scrollbar{ display:none; }
.cat-chip{ flex-shrink:0; font-family: var(--font-body); font-size: 13px; font-weight:500; padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; background: var(--surface); white-space: nowrap; transition: all 0.15s ease; }
.cat-chip.active{ background: linear-gradient(135deg, rgba(79,216,255,0.18), rgba(255,95,180,0.18)); border-color: var(--cyan); color: var(--text); font-weight: 600; box-shadow: 0 0 12px rgba(79,216,255,0.15); }

.section-label{ font-family: var(--font-mono); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-faint); padding: 18px 20px 10px; }

.badge-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 0 20px; }
.badge-card{ background: var(--surface); border-radius: 16px; padding: 18px 14px 16px; position: relative; cursor: pointer; border: 1px solid var(--border); transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease; color: var(--text); }
.badge-card:hover{ transform: translateY(-2px); border-color: var(--border-strong); }
.badge-card.locked{ color: var(--text-faint); }
.badge-card.locked .patch-icon{ filter: grayscale(1) opacity(0.35); }
.badge-card.unlocked{ border-color: var(--cyan); box-shadow: 0 0 18px rgba(79,216,255,0.16), inset 0 0 0 1px rgba(79,216,255,0.12); }

.tier-tag{ position:absolute; top:10px; right:10px; font-family: var(--font-mono); font-size: 9px; letter-spacing:1px; text-transform:uppercase; padding: 3px 7px; border-radius: 6px; color: var(--text-dim); background: var(--surface-2); border: 1px solid var(--border-strong); }
.drag-handle{ position:absolute; top:8px; left:8px; font-size:14px; line-height:1; color: var(--text-faint); cursor:grab; touch-action:none; padding:5px 6px; z-index:3; user-select:none; -webkit-user-select:none; }
.badge-card.locked .drag-handle{ color: var(--text-faint); }
.badge-card.drag-origin{ opacity:0.3; }
.drag-floating{ transition:none !important; }

.patch-icon{ width: 48px; height: 48px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size: 22px; margin-bottom: 12px; background: radial-gradient(circle at 35% 30%, rgba(79,216,255,0.22), rgba(255,95,180,0.14)); border: 1px solid var(--border-strong); position:relative; }
.badge-card.locked .patch-icon{ background: var(--surface-2); border-color: var(--border); }
.check-overlay{ position:absolute; bottom:-4px; right:-4px; background: var(--bg); border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:11px; border: 2px solid var(--surface); box-shadow: 0 0 8px rgba(79,216,255,0.5); }

.badge-name{ font-family: var(--font-body); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.25; margin-bottom: 4px; color: var(--text); }
.badge-desc{ font-size: 12px; line-height: 1.4; color: var(--text-dim); }
.badge-meta{ font-family: var(--font-mono); font-size: 10px; margin-top: 8px; color: var(--cyan); font-weight:600; }
.badge-card.locked .badge-meta{ color: var(--text-faint); }
.badge-date{ font-family: var(--font-mono); font-size: 10px; margin-top: 3px; color: var(--text-faint); }
.badge-tier-desc{ font-size: 11px; margin-top: 3px; color: var(--text-dim); }

.toast{ position: fixed; bottom: -120px; left: 50%; transform: translateX(-50%); background: var(--surface-2); color: var(--text); padding: 14px 20px; border-radius: 16px; border: 1px solid var(--border-strong); display:flex; align-items:center; gap: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 0 24px rgba(79,216,255,0.18); transition: bottom 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); z-index: 100; max-width: 90vw; }
.toast.show{ bottom: 24px; }
.toast-icon{ width: 40px; height: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(79,216,255,0.3), rgba(255,95,180,0.2)); display:flex; align-items:center; justify-content:center; font-size: 18px; border: 1px solid var(--border-strong); flex-shrink:0; }
.toast-text{ font-family: var(--font-body); font-size:12px; color: var(--text-dim); }
.toast-text b{ display:block; font-size:14px; color: var(--text); font-weight:600; }

.loading{ text-align:center; padding: 60px 20px; color: var(--text-faint); font-family: var(--font-mono); font-size: 12px; }

/* ===== MODALS ===== */
.modal-overlay{ display:none; position:fixed; inset:0; background: rgba(5,5,10,0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 200; align-items:flex-end; justify-content:center; }
.modal-overlay.show{ display:flex; }
.modal-box{ background: var(--surface-2); color: var(--text); width:100%; max-width: 460px; max-height: 88vh; overflow-y:auto; border-radius: 20px 20px 0 0; padding: 24px 20px 32px; border: 1px solid var(--border-strong); box-shadow: 0 -10px 50px rgba(0,0,0,0.5); }
@media (min-width: 500px){ .modal-overlay{ align-items:center; } .modal-box{ border-radius: 20px; } }
.modal-title{ font-family: var(--font-display); font-size: 20px; font-weight:700; letter-spacing: -0.02em; margin-bottom: 18px; color: var(--text); }
.field-label{ font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-faint); margin-bottom: 6px; margin-top: 16px; display:block; }
.modal-box input[type="text"], .modal-box input[type="date"], .modal-box select, .modal-box textarea{ width:100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 14px; font-family: var(--font-body); font-size: 14px; color: var(--text); outline:none; transition: border-color .15s ease; }
.modal-box input[type="text"]:focus, .modal-box input[type="date"]:focus, .modal-box select:focus, .modal-box textarea:focus{ border-color: var(--cyan); }
.modal-box input::placeholder{ color: var(--text-faint); }
.modal-box select option{ background: var(--surface-2); color: var(--text); }
.emoji-quickpicks{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.emoji-quickpicks button{ background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 18px; padding: 7px 10px; cursor:pointer; transition: border-color .15s ease; }
.emoji-quickpicks button:hover{ border-color: var(--cyan); }

.type-toggle{ display:flex; gap:8px; margin-top: 6px; }
.type-toggle label{ flex:1; text-align:center; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--border); font-family: var(--font-body); font-size: 12px; font-weight:500; color: var(--text-dim); cursor:pointer; transition: all .15s ease; }
.type-toggle input{ display:none; }
.type-toggle label.active{ border-color: var(--cyan); background: rgba(79,216,255,0.1); color: var(--text); font-weight:600; }

.tier-row{ padding: 12px 0; border-bottom: 1px solid var(--border); }
.tier-row-top{ display:flex; align-items:center; gap:10px; }
.tier-row .tier-icon{ font-size:20px; width:26px; text-align:center; flex-shrink:0; }
.tier-row .tier-label{ flex:1; font-family: var(--font-body); font-size:13px; font-weight:600; color: var(--text); }
.tier-row input[type="date"]{ width: 135px; }
.date-with-clear{ display:flex; gap:8px; align-items:center; }
.date-with-clear input[type="date"]{ flex:1; }
.clear-date-btn, .tier-date-clear{
  flex-shrink:0;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 500;
  padding: 10px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: border-color .15s ease, color .15s ease;
}
.clear-date-btn:hover, .tier-date-clear:hover{ border-color: var(--danger); color: var(--danger); }
.tier-row-top .tier-date-clear{ padding: 6px 8px; font-size: 10px; }
.tier-desc-input{ margin-top:6px; font-size: 12px !important; }

.unique-unlock-row{ display:flex; align-items:center; gap:10px; margin-top:10px; }
.unique-unlock-row label{ font-family: var(--font-body); font-size:13px; color: var(--text-dim); }
.modal-box input[type="checkbox"]{ accent-color: var(--cyan); width:16px; height:16px; }

.modal-actions{ display:flex; gap:10px; margin-top: 24px; }
.modal-actions button{ flex:1; font-family: var(--font-body); font-weight:600; font-size: 14px; padding: 13px; border-radius: 12px; border: none; cursor:pointer; transition: all .15s ease; }
.btn-primary{ background: linear-gradient(135deg, var(--cyan), var(--pink)); color: #05050a; }
.btn-primary:hover{ filter: brightness(1.08); }
.btn-secondary{ background: var(--surface); color: var(--text); border: 1px solid var(--border) !important; }
.btn-secondary:hover{ border-color: var(--border-strong) !important; }
.btn-danger{ background: none; color: var(--danger); text-decoration: underline; font-size: 13px; margin-top: 16px; text-align:center; cursor:pointer; }

.cat-manage-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom: 1px solid var(--border); }
.cat-manage-row span{ flex:1; font-family: var(--font-body); font-size:14px; font-weight:500; color: var(--text); }
.cat-manage-row button{ background:none; border:none; color: var(--text-dim); font-size:16px; cursor:pointer; }
.add-cat-row{ display:flex; gap:8px; margin-top:16px; }
.add-cat-row input{ flex:1; }
.add-cat-row button{ background: linear-gradient(135deg, var(--cyan), var(--pink)); color: #05050a; border:none; border-radius:10px; padding:0 16px; font-family: var(--font-body); font-weight:600; font-size:13px; cursor:pointer; }

</style>
</head>
<body>

<!-- ===== ÉCRAN DE CONNEXION ===== -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <div class="auth-title">CARNET D'<span>EXPLOITS</span></div>
    <div class="auth-sub" id="authSubtitle">Connexion</div>
    <div class="auth-error" id="authError"></div>
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPassword" placeholder="Mot de passe">
    <button id="authSubmitBtn">Se connecter</button>
    <div class="auth-switch">
      <span id="authSwitchText">Pas encore de compte ?</span>
      <a id="authSwitchLink">Créer un compte</a>
    </div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <div class="header">
    <div class="top-row">
      <div>
        <div class="eyebrow">Carnet de terrain — édition personnelle</div>
        <div class="title">MES <span>EXPLOITS</span></div>
      </div>
      <button class="logout-btn" id="logoutBtn">Déconnexion</button>
    </div>

    <div class="rank-bar">
      <div class="rank-badge" id="rankBadge">I</div>
      <div class="rank-info">
        <div class="rank-name" id="rankName">Novice de terrain</div>
        <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
        <div class="xp-label" id="xpLabel">0 / 100 XP</div>
      </div>
    </div>

    <div class="streak-row">
      <button class="checkin-btn" id="checkinBtn">Pointer aujourd'hui</button>
      <div class="streak-count" id="streakLabel">0 jour de suite</div>
    </div>
  </div>

  <div class="action-bar">
    <button class="new-achievement-btn" id="openCreateBtn">+ Nouvel achievement</button>
    <button class="manage-cat-btn" id="openManageCatBtn">🗂 Catégories</button>
  </div>

  <div class="categories" id="categories"></div>
  <div class="section-label">Achievements</div>
  <div class="badge-grid" id="badgeGrid">
    <div class="loading">Ouverture du carnet…</div>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-icon" id="toastIcon">🏅</div>
  <div class="toast-text">Badge débloqué<b id="toastName"></b></div>
</div>

<!-- ===== MODAL CRÉATION ===== -->
<div class="modal-overlay" id="createOverlay">
  <div class="modal-box">
    <div class="modal-title">Nouvel achievement</div>

    <label class="field-label">Titre</label>
    <input type="text" id="cTitle" placeholder="Ex: Premier marathon">

    <label class="field-label">Description (facultatif)</label>
    <input type="text" id="cDesc" placeholder="Ex: Courir 42km sans s'arrêter">

    <label class="field-label">Icône</label>
    <input type="text" id="cIcon" placeholder="🏆" maxlength="4">
    <div class="emoji-quickpicks" id="cEmojiPicks"></div>

    <label class="field-label">Catégorie</label>
    <select id="cCat"></select>

    <label class="field-label">Type</label>
    <div class="type-toggle">
      <label id="typeUniqueLabel"><input type="radio" name="cType" value="unique" checked><span>Déblocage unique</span></label>
      <label id="typeTieredLabel"><input type="radio" name="cType" value="tiered"><span>À paliers</span></label>
    </div>

    <div id="tierCountBlock" style="display:none;">
      <label class="field-label">Nombre de paliers</label>
      <select id="cTierCount"></select>
      <label class="field-label">Description de chaque palier (facultatif)</label>
      <div id="cTierDescContainer"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" id="createCancelBtn">Annuler</button>
      <button class="btn-primary" id="createConfirmBtn">Créer</button>
    </div>
  </div>
</div>

<!-- ===== MODAL ÉDITION ===== -->
<div class="modal-overlay" id="editOverlay">
  <div class="modal-box">
    <div class="modal-title" id="editModalTitle">Achievement</div>

    <label class="field-label">Titre</label>
    <input type="text" id="eTitle">

    <label class="field-label">Description</label>
    <input type="text" id="eDesc">

    <label class="field-label">Icône</label>
    <input type="text" id="eIcon" maxlength="4">

    <label class="field-label">Catégorie</label>
    <select id="eCat"></select>

    <div id="editUniqueBlock" style="display:none;">
      <div class="unique-unlock-row">
        <input type="checkbox" id="eUnlockedCheck">
        <label for="eUnlockedCheck">Débloqué</label>
      </div>
      <label class="field-label">Date de déblocage (facultatif)</label>
      <div class="date-with-clear">
        <input type="date" id="eUnlockedDate">
        <button type="button" class="clear-date-btn" id="eUnlockedDateClear">Effacer</button>
      </div>
    </div>

    <div id="editTieredBlock" style="display:none;">
      <label class="field-label">Paliers</label>
      <div id="tierRowsContainer"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-secondary" id="editCancelBtn">Annuler</button>

<!-- ===== FIREBASE ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ---------- CONSTANTES ---------- */
const TIER_LEVELS = [
  {name:"Bois", icon:"🪵", xp:10},
  {name:"Pierre", icon:"🪨", xp:15},
  {name:"Bronze", icon:"🥉", xp:25},
  {name:"Argent", icon:"🥈", xp:40},
  {name:"Or", icon:"🥇", xp:60},
  {name:"Diamant", icon:"💎", xp:90},
  {name:"Améthyste", iconImg:"icons/gem-amethyste.png", xp:120},
  {name:"Émeraude", iconImg:"icons/gem-emeraude.png", xp:150},
  {name:"Rubis", iconImg:"icons/gem-rubis.png", xp:190},
  {name:"Opale", iconImg:"icons/gem-opale.png", xp:240},
];
function tierIconHTML(level, sizePx){
  if(!level) return '⭐';
  if(level.iconImg) return `<img src="${level.iconImg}" alt="${level.name}" style="width:${sizePx}px;height:${sizePx}px;object-fit:contain;">`;
  return level.icon;
}
const UNIQUE_CUSTOM_XP = 30;
const OLD_TIER_XP = { bronze: 20, argent: 50, or: 100 };
const QUICK_EMOJIS = ["🏆","🎯","🔥","💪","📚","🎨","🎵","🍕","✈️","🎮","🌱","🧘","⚽","🏃","💧","😴"];
const DEFAULT_CATEGORIES = ["Santé","Discipline","Social","Apprentissage","Aventure","Perso"];
const FALLBACK_CAT = "Perso";
const NEW_CAT_OPTION = "__new__";

/* ---------- SYSTÈME DE NIVEAUX ---------- */
const MAX_LEVEL = 50;

// Paliers de titre (le titre affiché change tous les 5 niveaux)
const LEVEL_TITLES = [
  {upTo:5,  title:"Novice de terrain"},
  {upTo:10, title:"Éclaireur"},
  {upTo:15, title:"Arpenteur"},
  {upTo:20, title:"Broussard"},
  {upTo:25, title:"Coureur des bois"},
  {upTo:30, title:"Vétéran"},
  {upTo:35, title:"Chef d'expédition"},
  {upTo:40, title:"Maître explorateur"},
  {upTo:45, title:"Éclaireur légendaire"},
  {upTo:50, title:"Légende du carnet"},
];
function titleForLevel(level){
  for(const t of LEVEL_TITLES){ if(level <= t.upTo) return t.title; }
  return LEVEL_TITLES[LEVEL_TITLES.length-1].title;
}

// XP cumulé nécessaire pour ATTEINDRE chaque niveau (courbe progressive :
// chaque niveau demande un peu plus que le précédent)
const LEVEL_THRESHOLDS = [0]; // index 0 = seuil du niveau 1 (0 XP)
for(let lvl=2; lvl<=MAX_LEVEL; lvl++){
  LEVEL_THRESHOLDS.push(Math.round(18 * Math.pow(lvl, 1.65)));
}

function getLevelInfo(xp){
  let level = 1;
  for(let i=LEVEL_THRESHOLDS.length-1; i>=0; i--){
    if(xp >= LEVEL_THRESHOLDS[i]){ level = i+1; break; }
  }
  const currentThreshold = LEVEL_THRESHOLDS[level-1];
  const nextThreshold = level < MAX_LEVEL ? LEVEL_THRESHOLDS[level] : null;
  return {
    level,
    title: titleForLevel(level),
    currentThreshold,
    nextThreshold,
    isMax: level >= MAX_LEVEL,
  };
}

const DEFAULT_BADGES = [
  {id:"d1", cat:"Santé", icon:"🌅", name:"Lève-tôt", desc:"Debout avant 7h, 5 jours de suite", tier:"argent", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d2", cat:"Santé", icon:"🏃", name:"Premier 10km", desc:"Courir 10 kilomètres d'une traite", tier:"or", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d3", cat:"Santé", icon:"💧", name:"Bien hydraté", desc:"2L d'eau par jour pendant une semaine", tier:"bronze", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d4", cat:"Santé", icon:"😴", name:"Nuit complète", desc:"8h de sommeil, 7 nuits de suite", tier:"argent", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d5", cat:"Discipline", icon:"🎯", name:"Zéro procrastination", desc:"Finir la tâche prioritaire 5 jours de suite", tier:"argent", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d6", cat:"Discipline", icon:"🧹", name:"Grand rangement", desc:"Désencombrer complètement une pièce", tier:"bronze", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d7", cat:"Discipline", icon:"📵", name:"Jeûne numérique", desc:"Une journée complète sans réseaux sociaux", tier:"bronze", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d8", cat:"Social", icon:"📞", name:"Renouer le lien", desc:"Appeler un vieil ami perdu de vue", tier:"bronze", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d9", cat:"Social", icon:"🙏", name:"Merci sincère", desc:"Remercier quelqu'un en personne pour son aide", tier:"bronze", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d10", cat:"Social", icon:"🤝", name:"Nouvelle connexion", desc:"Rencontrer et échanger avec une personne inconnue", tier:"argent", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d11", cat:"Apprentissage", icon:"📚", name:"Dévoreur de livres", desc:"Terminer un livre du début à la fin", tier:"argent", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d12", cat:"Apprentissage", icon:"🗣️", name:"Nouvelle langue", desc:"30 jours d'apprentissage d'une langue", tier:"or", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d13", cat:"Apprentissage", icon:"🎓", name:"Certifié", desc:"Terminer un cours en ligne jusqu'au bout", tier:"or", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d14", cat:"Aventure", icon:"🗺️", name:"Explorateur urbain", desc:"Visiter un quartier jamais exploré", tier:"bronze", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d15", cat:"Aventure", icon:"🎢", name:"Grand saut", desc:"Essayer une activité qui te fait peur", tier:"argent", type:"unique", unlocked:false, unlockedDate:null},
  {id:"d16", cat:"Aventure", icon:"✈️", name:"Nouveau territoire", desc:"Visiter une ville ou un pays inconnu", tier:"or", type:"unique", unlocked:false, unlockedDate:null},
];

let state = { badges: [], categories: [], streak: 0, lastCheckin: null };
let activeCat = "Tout";
let currentUser = null;
let isSignup = false;
let editingId = null;

/* ---------- AUTH UI ---------- */
const authScreen = document.getElementById('authScreen');
const appEl = document.getElementById('app');
const authError = document.getElementById('authError');

document.getElementById('authSwitchLink').addEventListener('click', () => {
  isSignup = !isSignup;
  document.getElementById('authSubtitle').textContent = isSignup ? "Créer un compte" : "Connexion";
  document.getElementById('authSubmitBtn').textContent = isSignup ? "Créer le compte" : "Se connecter";
  document.getElementById('authSwitchText').textContent = isSignup ? "Déjà un compte ?" : "Pas encore de compte ?";
  document.getElementById('authSwitchLink').textContent = isSignup ? "Se connecter" : "Créer un compte";
  authError.textContent = "";
});

document.getElementById('authSubmitBtn').addEventListener('click', async () => {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  authError.textContent = "";
  if(!email || !password){ authError.textContent = "Remplis email et mot de passe."; return; }
  try{
    if(isSignup){
      await createUserWithEmailAndPassword(auth, email, password);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  }catch(e){
    authError.textContent = translateAuthError(e.code);
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

function translateAuthError(code){
  const map = {
    'auth/email-already-in-use': "Un compte existe déjà avec cet email.",
    'auth/invalid-email': "Email invalide.",
    'auth/weak-password': "Mot de passe trop court (6 caractères min).",
    'auth/user-not-found': "Aucun compte avec cet email.",
    'auth/wrong-password': "Mot de passe incorrect.",
    'auth/invalid-credential': "Email ou mot de passe incorrect.",
    'auth/unauthorized-domain': "Ce domaine n'est pas autorisé dans Firebase (Authentication > Settings > Authorized domains).",
    'auth/configuration-not-found': "Configuration Firebase introuvable — vérifie firebase-config.js.",
  };
  return map[code] || "Une erreur est survenue. Réessaie.";
}

onAuthStateChanged(auth, async (user) => {
  if(user){
    currentUser = user;
    authScreen.style.display = 'none';
    appEl.style.display = 'block';
    await loadState();
  } else {
    currentUser = null;
    authScreen.style.display = 'flex';
    appEl.style.display = 'none';
  }
});

/* ---------- DATA (Firestore) ---------- */
async function loadState(){
  const ref = doc(db, "users", currentUser.uid);
  const snap = await getDoc(ref);
  if(snap.exists()){
    const data = snap.data();
    state.badges = migrateBadges(data.badges || DEFAULT_BADGES);
    state.categories = data.categories && data.categories.length ? data.categories : deriveCategories(state.badges);
    state.streak = data.streak || 0;
    state.lastCheckin = data.lastCheckin || null;
  } else {
    state.badges = DEFAULT_BADGES;
    state.categories = [...DEFAULT_CATEGORIES];
    state.streak = 0; state.lastCheckin = null;
    await saveAll();
  }
  render();
}

function deriveCategories(badges){
  const set = new Set(badges.map(b=>b.cat).filter(Boolean));
  set.add(FALLBACK_CAT);
  return [...set];
}

function migrateBadges(badges){
  return badges.map(b => {
    if(!b.type) b.type = "unique";
    if(!b.cat) b.cat = FALLBACK_CAT;
    if(b.type === "unique" && b.unlockedDate === undefined) b.unlockedDate = null;
    if(b.type === "tiered"){
      if(!b.tierCount) b.tierCount = 5;
      if(b.currentTier === undefined) b.currentTier = 0;
      if(!b.tierDates) b.tierDates = Array(b.tierCount).fill(null);
      if(!b.tierDescriptions) b.tierDescriptions = Array(b.tierCount).fill('');
    }
    return b;
  });
}

async function saveAll(){
  const ref = doc(db, "users", currentUser.uid);
  await setDoc(ref, {
    badges: state.badges,
    categories: state.categories,
    streak: state.streak,
    lastCheckin: state.lastCheckin
  });
}

/* ---------- XP ---------- */
function badgeXP(b){
  if(b.type === "unique"){
    if(!b.unlocked) return 0;
    if(b.tier && OLD_TIER_XP[b.tier]) return OLD_TIER_XP[b.tier];
    return UNIQUE_CUSTOM_XP;
  }
  if(b.type === "tiered"){
    let total = 0;
    for(let i=0; i<b.currentTier; i++){
      total += TIER_LEVELS[i] ? TIER_LEVELS[i].xp : 0;
    }
    return total;
  }
  return 0;
}
function totalXP(){
  return state.badges.reduce((sum,b) => sum + badgeXP(b), 0);
}

/* ---------- RENDER ---------- */
function renderHeader(){
  const xp = totalXP();
  const info = getLevelInfo(xp);
  document.getElementById('rankName').textContent = `Niveau ${info.level} — ${info.title}`;
  document.getElementById('rankBadge').textContent = info.level;
  if(!info.isMax){
    const span = info.nextThreshold - info.currentThreshold;
    const progress = xp - info.currentThreshold;
    document.getElementById('xpFill').style.width = Math.min(100, (progress/span)*100) + '%';
    document.getElementById('xpLabel').textContent = `${xp} / ${info.nextThreshold} XP — prochain niveau`;
  } else {
    document.getElementById('xpFill').style.width = '100%';
    document.getElementById('xpLabel').textContent = `${xp} XP — niveau maximum (${MAX_LEVEL})`;
  }
  document.getElementById('streakLabel').textContent =
    state.streak === 0 ? "0 jour de suite" : state.streak === 1 ? "1 jour de suite" : `${state.streak} jours de suite`;
  const today = new Date().toDateString();
  const btn = document.getElementById('checkinBtn');
  if(state.lastCheckin === today){ btn.disabled = true; btn.textContent = "Déjà pointé aujourd'hui"; }
  else { btn.disabled = false; btn.textContent = "Pointer aujourd'hui"; }
}

function renderCategories(){
  const cats = ["Tout", ...state.categories];
  const el = document.getElementById('categories');
  el.innerHTML = cats.map(c => `<button class="cat-chip ${c===activeCat?'active':''}" data-cat="${c}">${c}</button>`).join('');
  el.querySelectorAll('.cat-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ activeCat = chip.dataset.cat; render(); });
  });
}

function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function renderBadges(){
  const grid = document.getElementById('badgeGrid');
  const list = activeCat === "Tout" ? state.badges : state.badges.filter(b=>b.cat===activeCat);
  grid.innerHTML = list.map(b => {
    if(b.type === "unique"){
      const meta = b.unlocked ? '✓ débloqué' : 'Non débloqué';
      const dateLine = b.unlockedDate ? `<div class="badge-date">${formatDate(b.unlockedDate)}</div>` : '';
      return `
        <div class="badge-card ${b.unlocked ? 'unlocked':'locked'}" data-id="${b.id}">
          <div class="drag-handle" data-id="${b.id}">⋮⋮</div>
          <div class="patch-icon">${b.icon}${b.unlocked ? '<span class="check-overlay">✅</span>' : ''}</div>
          <div class="badge-name">${b.name}</div>
          <div class="badge-desc">${b.desc || ''}</div>
          <div class="badge-meta">${meta}</div>
          ${dateLine}
        </div>`;
    } else {
      const hasTier = b.currentTier > 0;
      const level = hasTier ? TIER_LEVELS[b.currentTier-1] : null;
      const meta = hasTier ? `${level.name} — ${b.currentTier}/${b.tierCount}` : `0/${b.tierCount} paliers`;
      const dateVal = hasTier ? b.tierDates[b.currentTier-1] : null;
      const tierDesc = hasTier ? (b.tierDescriptions[b.currentTier-1] || '') : '';
      const dateLine = dateVal ? `<div class="badge-date">${formatDate(dateVal)}</div>` : '';
      const descLine = tierDesc ? `<div class="badge-tier-desc">${tierDesc}</div>` : '';
      const overlay = hasTier ? `<span class="check-overlay">${tierIconHTML(level, 13)}</span>` : '';
      return `
        <div class="badge-card ${hasTier ? 'unlocked':'locked'}" data-id="${b.id}">
          <div class="drag-handle" data-id="${b.id}">⋮⋮</div>
          <div class="tier-tag">${hasTier ? b.currentTier+'/'+b.tierCount : b.tierCount+' paliers'}</div>
          <div class="patch-icon">${b.icon}${overlay}</div>
          <div class="badge-name">${b.name}</div>
          <div class="badge-desc">${b.desc || ''}</div>
          <div class="badge-meta">${meta}</div>
          ${descLine}
          ${dateLine}
        </div>`;
    }
  }).join('');
  grid.querySelectorAll('.badge-card').forEach(card=>{
    card.addEventListener('click', ()=> openEditModal(card.dataset.id));
  });
  attachDragHandlers();
}

function render(){ renderHeader(); renderCategories(); renderBadges(); }

function showToast(iconHTML, name){
  const toast = document.getElementById('toast');
  document.getElementById('toastIcon').innerHTML = iconHTML;
  document.getElementById('toastName').textContent = name;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 2600);
}

/* ---------- CHECK-IN ---------- */
document.getElementById('checkinBtn').addEventListener('click', async ()=>{
  const today = new Date().toDateString();
  if(state.lastCheckin === today) return;
  const yesterday = new Date(Date.now() - 86400000).toDateString();
  state.streak = (state.lastCheckin === yesterday) ? state.streak + 1 : 1;
  state.lastCheckin = today;
  render();
  await saveAll();
});

/* ---------- SELECTS DE CATÉGORIE ---------- */
function fillCategorySelect(selectEl, selectedValue){
  selectEl.innerHTML = state.categories.map(c => `<option value="${c}">${c}</option>`).join('')
    + `<option value="${NEW_CAT_OPTION}">➕ Nouvelle catégorie…</option>`;
  selectEl.value = state.categories.includes(selectedValue) ? selectedValue : (state.categories[0] || FALLBACK_CAT);
}

function handleNewCategoryOnSelect(selectEl){
  selectEl.addEventListener('change', () => {
    if(selectEl.value === NEW_CAT_OPTION){
      const name = window.prompt("Nom de la nouvelle catégorie :");
      const trimmed = (name || '').trim();
      if(trimmed && !state.categories.includes(trimmed)){
        state.categories.push(trimmed);
        saveAll();
        fillCategorySelect(selectEl, trimmed);
      } else if(trimmed && state.categories.includes(trimmed)){
        fillCategorySelect(selectEl, trimmed);
      } else {
        fillCategorySelect(selectEl, state.categories[0] || FALLBACK_CAT);
      }
    }
  });
}

/* ---------- CRÉATION ---------- */
const createOverlay = document.getElementById('createOverlay');
const cEmojiPicks = document.getElementById('cEmojiPicks');
cEmojiPicks.innerHTML = QUICK_EMOJIS.map(e => `<button type="button" data-e="${e}">${e}</button>`).join('');
cEmojiPicks.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click', ()=> { document.getElementById('cIcon').value = btn.dataset.e; });
});

const cCat = document.getElementById('cCat');
handleNewCategoryOnSelect(cCat);

const cTierCount = document.getElementById('cTierCount');
for(let n=2; n<=10; n++){
  const opt = document.createElement('option');
  opt.value = n; opt.textContent = `${n} paliers`;
  if(n===5) opt.selected = true;
  cTierCount.appendChild(opt);
}

function renderCreateTierDescInputs(){
  const count = parseInt(cTierCount.value, 10);
  const container = document.getElementById('cTierDescContainer');
  const prevValues = [...container.querySelectorAll('.tier-desc-input')].map(i=>i.value);
  container.innerHTML = '';
  for(let i=0; i<count; i++){
    const level = TIER_LEVELS[i] || {name:`Palier ${i+1}`, icon:'⭐'};
    const wrap = document.createElement('div');
    wrap.style.marginTop = '8px';
    wrap.innerHTML = `
      <label class="field-label" style="margin-top:4px; display:flex; align-items:center; gap:6px;">${tierIconHTML(level, 16)} ${level.name}</label>
      <input type="text" class="tier-desc-input" placeholder="Ex: 5km" value="${prevValues[i] || ''}">
    `;
    container.appendChild(wrap);
  }
}
cTierCount.addEventListener('change', renderCreateTierDescInputs);

function updateTypeToggleUI(){
  const type = document.querySelector('input[name="cType"]:checked').value;
  document.getElementById('tierCountBlock').style.display = type === 'tiered' ? 'block' : 'none';
  document.getElementById('typeUniqueLabel').classList.toggle('active', type === 'unique');
  document.getElementById('typeTieredLabel').classList.toggle('active', type === 'tiered');
  if(type === 'tiered') renderCreateTierDescInputs();
}
document.querySelectorAll('input[name="cType"]').forEach(r => r.addEventListener('change', updateTypeToggleUI));

document.getElementById('openCreateBtn').addEventListener('click', ()=>{
  document.getElementById('cTitle').value = '';
  document.getElementById('cDesc').value = '';
  document.getElementById('cIcon').value = '';
  fillCategorySelect(cCat, activeCat !== 'Tout' ? activeCat : (state.categories[0] || FALLBACK_CAT));
  document.querySelector('input[name="cType"][value="unique"]').checked = true;
  updateTypeToggleUI();
  createOverlay.classList.add('show');
});
document.getElementById('createCancelBtn').addEventListener('click', ()=> createOverlay.classList.remove('show'));

document.getElementById('createConfirmBtn').addEventListener('click', async ()=>{
  const title = document.getElementById('cTitle').value.trim();
  if(!title) return;
  const desc = document.getElementById('cDesc').value.trim();
  const icon = document.getElementById('cIcon').value.trim() || '🏆';
  const type = document.querySelector('input[name="cType"]:checked').value;
  const cat = cCat.value === NEW_CAT_OPTION ? (state.categories[0] || FALLBACK_CAT) : cCat.value;

  const newBadge = { id: 'custom-' + Date.now(), cat, icon, name: title, desc, type };
  if(type === 'unique'){
    newBadge.unlocked = false;
    newBadge.unlockedDate = null;
  } else {
    const tierCount = parseInt(cTierCount.value, 10);
    newBadge.tierCount = tierCount;
    newBadge.currentTier = 0;
    newBadge.tierDates = Array(tierCount).fill(null);
    newBadge.tierDescriptions = [...document.querySelectorAll('.tier-desc-input')].map(i=>i.value.trim());
  }
  state.badges.push(newBadge);
  createOverlay.classList.remove('show');
  render();
  await saveAll();
});

/* ---------- ÉDITION ---------- */
const editOverlay = document.getElementById('editOverlay');
const eCat = document.getElementById('eCat');
handleNewCategoryOnSelect(eCat);

function openEditModal(id){
  const b = state.badges.find(x=>x.id===id);
  if(!b) return;
  editingId = id;
  document.getElementById('editModalTitle').textContent = b.name;
  document.getElementById('eTitle').value = b.name;
  document.getElementById('eDesc').value = b.desc || '';
  document.getElementById('eIcon').value = b.icon;
  fillCategorySelect(eCat, b.cat);

  const uniqueBlock = document.getElementById('editUniqueBlock');
  const tieredBlock = document.getElementById('editTieredBlock');

  if(b.type === 'unique'){
    uniqueBlock.style.display = 'block';
    tieredBlock.style.display = 'none';
    document.getElementById('eUnlockedCheck').checked = b.unlocked;
    document.getElementById('eUnlockedDate').value = b.unlockedDate || '';
  } else {
    uniqueBlock.style.display = 'none';
    tieredBlock.style.display = 'block';
    const container = document.getElementById('tierRowsContainer');
    container.innerHTML = '';
    for(let i=0; i<b.tierCount; i++){
      const level = TIER_LEVELS[i] || {name:`Palier ${i+1}`, icon:'⭐'};
      const row = document.createElement('div');
      row.className = 'tier-row';
      row.innerHTML = `
        <div class="tier-row-top">
          <span class="tier-icon">${tierIconHTML(level, 20)}</span>
          <span class="tier-label">${level.name}</span>
          <input type="date" class="tier-date-input" data-idx="${i}" value="${b.tierDates[i] || ''}">
          <button type="button" class="clear-date-btn tier-date-clear" data-idx="${i}">Effacer</button>
        </div>
        <input type="text" class="tier-desc-input" data-idx="${i}" placeholder="À quoi correspond ce palier ?" value="${(b.tierDescriptions && b.tierDescriptions[i]) || ''}">
      `;
      container.appendChild(row);
    }
    container.querySelectorAll('.tier-date-clear').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = btn.dataset.idx;
        container.querySelector(`.tier-date-input[data-idx="${idx}"]`).value = '';
      });
    });
  }
  editOverlay.classList.add('show');
}

document.getElementById('eUnlockedDateClear').addEventListener('click', ()=>{
  document.getElementById('eUnlockedDate').value = '';
});

document.getElementById('editCancelBtn').addEventListener('click', ()=>{
  editOverlay.classList.remove('show');
  editingId = null;
});

document.getElementById('editSaveBtn').addEventListener('click', async ()=>{
  const b = state.badges.find(x=>x.id===editingId);
  if(!b) return;
  const wasUnlocked = b.type === 'unique' ? b.unlocked : b.currentTier > 0;

  b.name = document.getElementById('eTitle').value.trim() || b.name;
  b.desc = document.getElementById('eDesc').value.trim();
  b.icon = document.getElementById('eIcon').value.trim() || b.icon;
  b.cat = eCat.value === NEW_CAT_OPTION ? b.cat : eCat.value;

  if(b.type === 'unique'){
    b.unlocked = document.getElementById('eUnlockedCheck').checked;
    b.unlockedDate = document.getElementById('eUnlockedDate').value || null;
    if(b.unlocked && !wasUnlocked) showToast(b.icon, b.name);
  } else {
    const dateInputs = document.querySelectorAll('.tier-date-input');
    const descInputs = document.querySelectorAll('.tier-desc-input');
    let newTierDates = [...b.tierDates];
    let newTierDescs = [...(b.tierDescriptions || Array(b.tierCount).fill(''))];
    dateInputs.forEach(inp=>{
      const idx = parseInt(inp.dataset.idx, 10);
      newTierDates[idx] = inp.value || null;
    });
    descInputs.forEach(inp=>{
      const idx = parseInt(inp.dataset.idx, 10);
      newTierDescs[idx] = inp.value.trim();
    });
    b.tierDates = newTierDates;
    b.tierDescriptions = newTierDescs;
    let highest = 0;
    newTierDates.forEach((d, idx) => { if(d) highest = idx+1; });
    const newTier = highest;
    if(newTier > b.currentTier){
      const level = TIER_LEVELS[newTier-1];
      showToast(tierIconHTML(level, 18), `${b.name} — ${level ? level.name : ''}`);
    }
    b.currentTier = newTier;
  }

  editOverlay.classList.remove('show');
  editingId = null;
  render();
  await saveAll();
});

document.getElementById('editDeleteBtn').addEventListener('click', async ()=>{
  if(!editingId) return;
  if(!confirm('Supprimer définitivement cet achievement ?')) return;
  state.badges = state.badges.filter(b=>b.id!==editingId);
  editOverlay.classList.remove('show');
  editingId = null;
  render();
  await saveAll();
});

/* ---------- GLISSER-DÉPOSER (réorganisation) ---------- */
let dragState = null;

function attachDragHandlers(){
  document.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.addEventListener('pointerdown', onDragHandlePointerDown);
    handle.addEventListener('click', e => e.stopPropagation());
  });
}

function onDragHandlePointerDown(e){
  e.preventDefault();
  e.stopPropagation();
  const handle = e.currentTarget;
  const card = handle.closest('.badge-card');
  const rect = card.getBoundingClientRect();

  const floating = card.cloneNode(true);
  floating.classList.add('drag-floating');
  floating.style.position = 'fixed';
  floating.style.left = rect.left + 'px';
  floating.style.top = rect.top + 'px';
  floating.style.width = rect.width + 'px';
  floating.style.height = rect.height + 'px';
  floating.style.margin = '0';
  floating.style.pointerEvents = 'none';
  floating.style.zIndex = '500';
  floating.style.transform = 'scale(1.05) rotate(-1deg)';
  floating.style.boxShadow = '0 12px 24px rgba(0,0,0,0.5)';
  document.body.appendChild(floating);

  card.classList.add('drag-origin');

  dragState = {
    id: card.dataset.id,
    card, floating, handle,
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
    pointerId: e.pointerId,
  };

  try{ handle.setPointerCapture(e.pointerId); }catch(err){}
  document.addEventListener('pointermove', onDragPointerMove, {passive:false});
  document.addEventListener('pointerup', onDragPointerUp);
  document.addEventListener('pointercancel', onDragPointerUp);
}

function onDragPointerMove(e){
  if(!dragState) return;
  e.preventDefault();
  dragState.floating.style.left = (e.clientX - dragState.offsetX) + 'px';
  dragState.floating.style.top = (e.clientY - dragState.offsetY) + 'px';

  // pointer-events:none sur le clone flottant permet à elementFromPoint
  // de "voir à travers" et de trouver la vraie carte survolée en dessous
  const elUnder = document.elementFromPoint(e.clientX, e.clientY);
  const targetCard = elUnder ? elUnder.closest('.badge-card') : null;
  if(!targetCard || targetCard === dragState.card || targetCard.classList.contains('drag-floating')) return;

  const grid = document.getElementById('badgeGrid');
  if(targetCard.parentElement !== grid) return;

  const cards = Array.from(grid.children);
  const originIdx = cards.indexOf(dragState.card);
  const targetIdx = cards.indexOf(targetCard);
  if(originIdx === -1 || targetIdx === -1) return;

  if(originIdx < targetIdx){
    grid.insertBefore(dragState.card, targetCard.nextSibling);
  } else {
    grid.insertBefore(dragState.card, targetCard);
  }
}

async function onDragPointerUp(e){
  if(!dragState) return;
  document.removeEventListener('pointermove', onDragPointerMove);
  document.removeEventListener('pointerup', onDragPointerUp);
  document.removeEventListener('pointercancel', onDragPointerUp);
  try{ dragState.handle.releasePointerCapture(dragState.pointerId); }catch(err){}

  const grid = document.getElementById('badgeGrid');
  const finalVisibleIds = Array.from(grid.querySelectorAll('.badge-card')).map(c => c.dataset.id);

  dragState.floating.remove();
  dragState.card.classList.remove('drag-origin');
  dragState = null;

  commitReorder(finalVisibleIds);
  render();
  await saveAll();
}

function commitReorder(visibleIdsInNewOrder){
  const byId = {};
  state.badges.forEach(b => { byId[b.id] = b; });
  const vSet = new Set(visibleIdsInNewOrder);
  const queue = visibleIdsInNewOrder.map(id => byId[id]).filter(Boolean);

  let newBadges = [];
  let inserted = false;
  for(const b of state.badges){
    if(vSet.has(b.id)){
      if(!inserted){ newBadges.push(...queue); inserted = true; }
    } else {
      newBadges.push(b);
    }
  }
  state.badges = newBadges;
}

/* ---------- GESTION DES CATÉGORIES ---------- */
const manageCatOverlay = document.getElementById('manageCatOverlay');

function renderCatManageList(){
  const list = document.getElementById('catManageList');
  list.innerHTML = state.categories.map(c => `
    <div class="cat-manage-row">
      <span>${c}</span>
      <button class="rename-cat-btn" data-cat="${c}" title="Renommer">✏️</button>
      <button data-cat="${c}" title="Supprimer">🗑</button>
    </div>
  `).join('');
  list.querySelectorAll('.rename-cat-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const oldName = btn.dataset.cat;
      const input = prompt('Nouveau nom de la catégorie :', oldName);
      if(input === null) return;
      const newName = input.trim();
      if(!newName || newName === oldName) return;
      if(state.categories.includes(newName)){ alert('Cette catégorie existe déjà.'); return; }
      state.categories = state.categories.map(c => c === oldName ? newName : c);
      state.badges.forEach(b=>{ if(b.cat === oldName) b.cat = newName; });
      if(activeCat === oldName) activeCat = newName;
      renderCatManageList();
      render();
      await saveAll();
    });
  });
  list.querySelectorAll('button:not(.rename-cat-btn)').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const cat = btn.dataset.cat;
      if(!confirm(`Supprimer la catégorie "${cat}" ? Les achievements concernés passeront dans "${FALLBACK_CAT}".`)) return;
      state.categories = state.categories.filter(c=>c!==cat);
      if(state.categories.length === 0) state.categories = [FALLBACK_CAT];
      if(!state.categories.includes(FALLBACK_CAT)) state.categories.push(FALLBACK_CAT);
      state.badges.forEach(b=>{ if(b.cat === cat) b.cat = FALLBACK_CAT; });
      if(activeCat === cat) activeCat = "Tout";
      renderCatManageList();
      render();
      await saveAll();
    });
  });
}

document.getElementById('openManageCatBtn').addEventListener('click', ()=>{
  renderCatManageList();
  manageCatOverlay.classList.add('show');
});
document.getElementById('closeManageCatBtn').addEventListener('click', ()=> manageCatOverlay.classList.remove('show'));

document.getElementById('addCatBtn').addEventListener('click', async ()=>{
  const input = document.getElementById('newCatInput');
  const name = input.value.trim();
  if(!name || state.categories.includes(name)) return;
  state.categories.push(name);
  input.value = '';
  renderCatManageList();
  render();
  await saveAll();
});

/* ---------- FERMETURE DES POPUPS (clic en dehors / touche Échap) ---------- */
function setupModalDismiss(overlay, dismissBtnId){
  overlay.addEventListener('click', (e)=>{
    if(e.target === overlay){
      document.getElementById(dismissBtnId).click();
    }
  });
}
setupModalDismiss(createOverlay, 'createCancelBtn');
setupModalDismiss(editOverlay, 'editCancelBtn');
setupModalDismiss(manageCatOverlay, 'closeManageCatBtn');

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Escape') return;
  if(createOverlay.classList.contains('show')) document.getElementById('createCancelBtn').click();
  else if(editOverlay.classList.contains('show')) document.getElementById('editCancelBtn').click();
  else if(manageCatOverlay.classList.contains('show')) document.getElementById('closeManageCatBtn').click();
});

/* ---------- Service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
